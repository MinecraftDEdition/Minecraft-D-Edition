name: macOS test build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Test build version
        required: false
        default: 0.1.0
      publish_to_test:
        description: Replace the macOS installer and update feed on the Test release
        required: false
        type: boolean
        default: false
  push:
    branches:
      - codex/macos-port

permissions:
  contents: write

jobs:
  build-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: brew install ldc openssl@3

      - name: Prepare macOS dependencies
        run: bash distribution/macos/prepare_dependencies.sh

      - name: Prepare licensed EOS SDK
        env:
          GH_TOKEN: ${{ github.token }}
          EOS_SDK_ARCHIVE_KEY: ${{ secrets.EOS_SDK_ARCHIVE_KEY }}
        run: |
          test -n "$EOS_SDK_ARCHIVE_KEY"
          encrypted="$RUNNER_TEMP/mde-eos-macos-sdk-v1.19.1.2.tar.gz.enc"
          archive="$RUNNER_TEMP/mde-eos-macos-sdk-v1.19.1.2.tar.gz"
          eos_root="$RUNNER_TEMP/mde-eos-macos-sdk"
          gh release download build-dependencies \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mde-eos-macos-sdk-v1.19.1.2.tar.gz.enc' \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            'e460a2badebbcf68bfbb0d5c62b9e18ac217ea8280804c0e517fbe5fd24f7d3a' \
            "$encrypted" | shasum -a 256 --check
          "$(brew --prefix openssl@3)/bin/openssl" enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 -in "$encrypted" -out "$archive" \
            -pass env:EOS_SDK_ARCHIVE_KEY
          mkdir -p "$eos_root"
          tar -xzf "$archive" -C "$eos_root"
          test -f "$eos_root/SDK/Include/eos_sdk.h"
          test -f "$eos_root/SDK/Bin/libEOSSDK-Mac-Shipping.dylib"
          echo "MDE_EOS_SDK_ROOT=$eos_root/SDK" >> "$GITHUB_ENV"

      - name: Prepare Discord Social SDK
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_SDK_ARCHIVE_KEY: ${{ secrets.DISCORD_SDK_ARCHIVE_KEY }}
        run: |
          test -n "$DISCORD_SDK_ARCHIVE_KEY"
          encrypted="$RUNNER_TEMP/mde-discord-social-sdk-v1.10.19337.zip.enc"
          archive="$RUNNER_TEMP/mde-discord-social-sdk-v1.10.19337.zip"
          discord_root="$RUNNER_TEMP/mde-discord-social-sdk"
          gh release download build-dependencies \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'mde-discord-social-sdk-v1.10.19337.zip.enc' \
            --dir "$RUNNER_TEMP"
          printf '%s  %s\n' \
            'efa73921b689171f3ecbfb8b7d9153db3f57fb372816a398a4afdcddfebe45b3' \
            "$encrypted" | shasum -a 256 --check
          "$(brew --prefix openssl@3)/bin/openssl" enc -d -aes-256-cbc \
            -pbkdf2 -iter 200000 -in "$encrypted" -out "$archive" \
            -pass env:DISCORD_SDK_ARCHIVE_KEY
          mkdir -p "$discord_root"
          ditto -x -k "$archive" "$discord_root"
          sdk="$discord_root/discord_social_sdk"
          test -f "$sdk/include/discordpp.h"
          test -f "$sdk/include/cdiscord.h"
          test -f "$sdk/lib/release/libdiscord_partner_sdk.dylib"
          echo "MDE_DISCORD_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Configure secure update signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_ED25519 }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          key_file="$RUNNER_TEMP/mde-sparkle-ed25519"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          distribution/macos/build/deps/bin/generate_keys \
            --account com.minecraftdedition.game -f "$key_file" >/dev/null
          public_key="$(distribution/macos/build/deps/bin/generate_keys \
            --account com.minecraftdedition.game -p)"
          test -n "$public_key"
          echo "MDE_SPARKLE_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Reconstruct shared release content
        run: |
          python3 tools/reconstruct_release_content.py \
            --output distribution/macos/build/content

      - name: Build app and DMG
        env:
          MDE_VERSION: ${{ inputs.version || '0.1.0' }}
          MDE_BUILD_NUMBER: ${{ github.run_number }}
          MDE_CONTENT_ROOT: ${{ github.workspace }}/distribution/macos/build/content
          MDE_REQUIRE_EOS: 1
          MDE_REQUIRE_DISCORD: 1
        run: bash distribution/macos/build_macos.sh

      - name: Smoke-test application launch
        run: |
          executable='distribution/macos/build/bundle/Minecraft D Edition.app/Contents/MacOS/Minecraft D Edition'
          log="$RUNNER_TEMP/minecraft-d-edition-launch.log"
          error_log="$HOME/Library/Application Support/Minecraft D Edition/last-error.log"
          rm -f "$error_log"
          "$executable" >"$log" 2>&1 &
          game_pid=$!
          sleep 12
          if [[ -s "$error_log" ]]; then
            cat "$error_log"
            kill -TERM "$game_pid" 2>/dev/null || true
            wait "$game_pid" || true
            echo 'The macOS game reported a fatal startup error.' >&2
            exit 1
          fi
          if kill -0 "$game_pid" 2>/dev/null; then
            kill -TERM "$game_pid"
            wait "$game_pid" || true
          else
            status=0
            wait "$game_pid" || status=$?
            cat "$log"
            echo "The macOS game exited during its launch smoke test (status $status)." >&2
            exit 1
          fi

      - name: Smoke-test EOS Connect
        run: |
          executable='distribution/macos/build/bundle/Minecraft D Edition.app/Contents/MacOS/Minecraft D Edition'
          eos_home="$RUNNER_TEMP/eos-smoke-home"
          eos_log="$RUNNER_TEMP/eos-sdk-smoke.log"
          mkdir -p "$eos_home"
          set +e
          HOME="$eos_home" MDE_EOS_VERBOSE_LOGGING=1 \
            "$executable" --eos-smoke-test 2>&1 | tee "$eos_log"
          status=${PIPESTATUS[0]}
          set -e
          cat eos-smoke-test.log
          if [[ "$status" -eq 0 ]]; then
            grep -F 'EOS Connect login succeeded; P2P is ready.' eos-smoke-test.log
          elif grep -F 'EOSSDK Platform Configuration mac-dynamic' "$eos_log" \
              && grep -F 'InitializeP2PNetwork - Initialized' "$eos_log" \
              && grep -F 'An SSL error has occurred and a secure connection to the server cannot be made.' "$eos_log"; then
            echo '::warning::EOS initialized correctly, but the GitHub-hosted runner TLS proxy prevented the live backend login; physical-Mac verification is required.'
          else
            exit "$status"
          fi

      - name: Inspect application
        run: |
          file 'distribution/macos/build/bundle/Minecraft D Edition.app/Contents/MacOS/Minecraft D Edition'
          executable='distribution/macos/build/bundle/Minecraft D Edition.app/Contents/MacOS/Minecraft D Edition'
          otool -L "$executable"
          eos='distribution/macos/build/bundle/Minecraft D Edition.app/Contents/Frameworks/libEOSSDK-Mac-Shipping.dylib'
          discord='distribution/macos/build/bundle/Minecraft D Edition.app/Contents/Frameworks/libdiscord_partner_sdk.dylib'
          test -f "$eos"
          test -f "$discord"
          lipo -info "$eos"
          lipo -info "$discord"
          otool -L "$executable" | grep -F '@rpath/libdiscord_partner_sdk.dylib'
          codesign --verify --deep --strict --verbose=2 \
            'distribution/macos/build/bundle/Minecraft D Edition.app'

      - name: Generate signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.MACOS_SPARKLE_ED25519 }}
        run: |
          release_dir='distribution/macos/build/release'
          previous_dir="$RUNNER_TEMP/mde-previous-macos"
          mkdir -p "$release_dir"
          mkdir -p "$previous_dir"

          # Sparkle creates a signed binary delta when both the previous and
          # current archives are present. A missing previous release is valid
          # for the first publication and simply produces a full update.
          if gh release download Test \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'Minecraft.D.Edition-macOS-arm64.dmg' \
              --dir "$previous_dir"; then
            cp "$previous_dir/Minecraft.D.Edition-macOS-arm64.dmg" \
              "$release_dir/Minecraft.D.Edition-macOS-previous-arm64.dmg"
          else
            echo 'No previous macOS release was available; publishing a full update only.'
          fi

          cp distribution/macos/build/Minecraft.D.Edition-macOS-arm64.dmg \
            "$release_dir/Minecraft.D.Edition-macOS-arm64.dmg"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | \
            distribution/macos/build/deps/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
                'https://github.com/MinecraftDEdition/Minecraft-D-Edition/releases/download/Test/' \
              --maximum-deltas 1 \
              -o "$release_dir/mde-macos-appcast.xml" \
              "$release_dir"
          python3 - <<'PY'
          import urllib.parse
          import xml.etree.ElementTree as ET
          from pathlib import Path

          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          ET.register_namespace("sparkle", sparkle)
          release_dir = Path("distribution/macos/build/release")
          appcast = Path("distribution/macos/build/release/mde-macos-appcast.xml")
          tree = ET.parse(appcast)
          channel = tree.getroot().find("channel")
          if channel is None or channel.find("title") is None:
              raise SystemExit("Generated appcast has no channel title")
          channel.find("title").text = "Minecraft: D Edition"

          items = channel.findall("item")
          if not items:
              raise SystemExit("Generated appcast has no update items")
          version_tag = f"{{{sparkle}}}version"
          try:
              newest = max(items, key=lambda item: int(item.findtext(version_tag)))
          except (TypeError, ValueError):
              raise SystemExit("Generated appcast has an invalid build version")
          # The preceding archive is input for delta generation only. Keeping
          # its item would advertise a full-DMG URL that is not republished.
          for item in items:
              if item is not newest:
                  channel.remove(item)

          delta_from = f"{{{sparkle}}}deltaFrom"
          for enclosure in newest.findall(f"{{{sparkle}}}deltas/enclosure"):
              if delta_from not in enclosure.attrib:
                  continue
              url = urllib.parse.urlsplit(enclosure.attrib["url"])
              old_name = urllib.parse.unquote(url.path.rsplit("/", 1)[-1])
              safe_name = old_name.replace(" ", ".")
              old_path = release_dir / old_name
              safe_path = release_dir / safe_name
              if old_path != safe_path:
                  old_path.rename(safe_path)
              safe_url_path = url.path.rsplit("/", 1)[0] + "/" \
                  + urllib.parse.quote(safe_name)
              enclosure.attrib["url"] = urllib.parse.urlunsplit(
                  url._replace(path=safe_url_path))

          tree.write(appcast, encoding="utf-8", xml_declaration=True)
          PY

          if [[ -f "$release_dir/Minecraft.D.Edition-macOS-previous-arm64.dmg" ]]; then
            grep -q 'sparkle:deltaFrom' "$release_dir/mde-macos-appcast.xml"
            find "$release_dir" -maxdepth 1 -name '*.delta' -print -quit | grep -q .
          fi

      - name: Upload Mac test installer
        uses: actions/upload-artifact@v6
        with:
          name: Minecraft-D-Edition-macOS-arm64
          path: |
            distribution/macos/build/release/Minecraft.D.Edition-macOS-arm64.dmg
            distribution/macos/build/release/mde-macos-appcast.xml
            distribution/macos/build/release/*.delta
          if-no-files-found: error
          retention-days: 14

      - name: Publish Mac installer to Test release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir='distribution/macos/build/release'
          assets=(
            "$release_dir/Minecraft.D.Edition-macOS-arm64.dmg"
            "$release_dir/mde-macos-appcast.xml"
          )
          while IFS= read -r -d '' delta; do
            assets+=("$delta")
          done < <(find "$release_dir" -maxdepth 1 -name '*.delta' -print0)
          gh release upload Test "${assets[@]}" --clobber \
            --repo "$GITHUB_REPOSITORY"

          while IFS=$'\t' read -r asset_id asset_name; do
            [[ -n "$asset_id" ]] || continue
            if [[ ! -f "$release_dir/$asset_name" ]]; then
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/releases/tags/Test" \
            --jq '.assets[] | select(.name | endswith(".delta")) | [.id, .name] | @tsv')
